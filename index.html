<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品資料查詢系統-柏匯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background-color: #030814;
            color: #d1e8ff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .tech-card {
            background: rgba(8, 20, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.08), 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tech-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.12), 0 6px 25px rgba(0, 240, 255, 0.15);
        }

        .tech-title {
            color: #70d6ff;
            border-left: 4px solid #00f0ff;
            padding-left: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 標頭固定區塊 */
        header {
            background: linear-gradient(180deg, rgba(10, 28, 58, 0.95) 0%, rgba(3, 8, 20, 0.9) 100%);
            border-bottom: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(5, 15, 30, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.4);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        .pulse-online {
            box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .sort-header {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
            text-align: center;
            font-size: 0.95rem;
        }
        .sort-header:hover {
            color: #ffffff;
            background-color: rgba(0, 240, 255, 0.15);
        }

        .badge-mask {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
        }
        .badge-text {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid #eab308;
            color: #fde047;
        }
        .badge-route {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .badge-finish {
            background: rgba(249, 115, 22, 0.2);
            border: 1px solid #f97316;
            color: #fdba74;
        }

        .badge-fr4 {
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid #a855f7;
            color: #d8b4fe;
        }
        .badge-metal {
            background: rgba(245, 158, 11, 0.25);
            border: 1px solid #f59e0b;
            color: #fde047;
        }
        
        .spec-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        /* 頂部導覽頁籤樣式 */
        .nav-tab-active {
            background: rgba(0, 240, 255, 0.25);
            border: 1px solid #00f0ff;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .nav-tab-inactive {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #94a3b8;
        }
        .nav-tab-inactive:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }
    </style>
</head>
<body class="p-2 sm:p-3 flex flex-col h-screen overflow-hidden">

    <!-- 頂部標頭：永久固定在最上方 (shrink-0) -->
    <header class="rounded-lg p-3 mb-2.5 flex flex-col lg:flex-row items-center justify-between gap-3 relative shrink-0 z-20">
        
        <!-- 左側：標題、頁籤與全螢幕按鈕 -->
        <div class="flex items-center gap-3 w-full lg:w-auto">
            <i class="fa-solid fa-microchip text-3xl text-cyan-400 animate-pulse shrink-0"></i>
            <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-3">
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wider text-cyan-400 drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]">
                        產品規格與工程資料查詢
                    </h1>

                    <!-- 頂部切換頁籤 -->
                    <div class="flex items-center gap-1.5 ml-2">
                        <span class="nav-tab-active px-3 py-1 rounded text-xs font-bold flex items-center gap-1">
                            <i class="fa-solid fa-list-check"></i> 產品規格
                        </span>
                        <a href="成品庫存-index.html" class="nav-tab-inactive px-3 py-1 rounded text-xs font-bold flex items-center gap-1 transition-all">
                            <i class="fa-solid fa-boxes-packing"></i> 成品庫存
                        </a>
                    </div>

                    <!-- 全螢幕按鈕 -->
                    <button id="fullscreen-btn" onclick="toggleFullScreen()" class="tech-card px-2.5 py-1 text-cyan-400 hover:text-white hover:border-cyan-400 text-xs font-bold flex items-center gap-1.5 transition-all">
                        <i class="fa-solid fa-expand text-xs"></i>
                        <span id="fullscreen-btn-text">全螢幕</span>
                    </button>
                </div>

                <!-- 檔案名稱與更新時間 + 自動更新倒數 -->
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs sm:text-sm text-slate-300 mt-1">
                    <div class="flex items-center gap-2">
                        <span id="connection-status" class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-online"></span>
                        <span id="data-file-info" class="font-semibold text-slate-300">products_kt.json 更新時間: 讀取中...</span>
                    </div>
                    
                    <span class="text-slate-600 hidden sm:inline">|</span>

                    <div class="flex items-center gap-1.5 text-amber-400 font-semibold font-mono bg-amber-950/40 border border-amber-500/40 px-2 py-0.5 rounded text-xs">
                        <i class="fa-solid fa-hourglass-half animate-spin text-xs"></i>
                        <span>自動更新倒數:</span>
                        <span id="countdown-timer" class="font-bold text-amber-300 text-sm">60:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 正中間上方：現在時間 -->
        <div class="w-full lg:w-auto lg:absolute lg:left-1/2 lg:-translate-x-1/2 lg:top-1/2 lg:-translate-y-1/2 flex justify-center pointer-events-none">
            <div class="flex items-center bg-slate-900/90 border border-cyan-500/60 px-3.5 py-1.5 rounded-md text-cyan-300 font-mono shadow-[0_0_15px_rgba(0,240,255,0.2)] pointer-events-auto">
                <i class="fa-regular fa-clock mr-2 text-cyan-400 animate-pulse"></i>
                <span id="current-time" class="text-base font-extrabold tracking-wider text-cyan-300">
                    現在時間: 載入中...
                </span>
            </div>
        </div>

        <!-- 右側：4 個 KPI 統計卡片 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 w-full lg:w-auto shrink-0 items-center my-auto">
            <div class="tech-card px-3 py-2 flex items-center justify-center gap-2.5 h-full">
                <i class="fa-solid fa-boxes-stacked text-cyan-400 text-xl"></i>
                <div class="text-left">
                    <div class="text-xs text-slate-400 whitespace-nowrap">總產品數</div>
                    <div id="kpi-total" class="text-lg font-bold text-cyan-400 leading-tight">0</div>
                </div>
            </div>

            <div class="tech-card px-3 py-2 flex items-center justify-center gap-2.5 border-emerald-500/40 h-full">
                <i class="fa-solid fa-filter text-emerald-400 text-xl"></i>
                <div class="text-left">
                    <div class="text-xs text-slate-400 whitespace-nowrap">當前篩選</div>
                    <div id="kpi-filtered" class="text-lg font-bold text-emerald-400 leading-tight">0</div>
                </div>
            </div>

            <div class="tech-card px-3 py-2 flex items-center justify-center gap-2.5 border-amber-500/40 h-full">
                <i class="fa-solid fa-layer-group text-amber-400 text-xl"></i>
                <div class="text-left">
                    <div class="text-xs text-slate-400 whitespace-nowrap">金屬基板數</div>
                    <div id="kpi-metal-pcb" class="text-lg font-bold text-amber-400 leading-tight">0</div>
                </div>
            </div>

            <div class="tech-card px-3 py-2 flex items-center justify-center gap-2.5 border-purple-500/40 h-full">
                <i class="fa-solid fa-microchip text-purple-400 text-xl"></i>
                <div class="text-left">
                    <div class="text-xs text-slate-400 whitespace-nowrap">FR4 板數</div>
                    <div id="kpi-fr4-pcb" class="text-lg font-bold text-purple-400 leading-tight">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- 搜尋與過濾工具列 -->
    <div class="tech-card p-2.5 flex flex-col md:flex-row items-center justify-between gap-2.5 shrink-0 z-10 mb-2.5">
        <div class="relative w-full md:w-1/2">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400 text-sm"></i>
            <input type="text" id="searchInput" onkeyup="handleSearch()" 
                   placeholder="輸入 柏匯料號 / 客戶料號 / 底片編號 / 板材類別 / 使用材料 快速搜尋..." 
                   class="w-full pl-9 pr-8 py-1.5 bg-slate-900/80 border border-cyan-800/80 rounded text-cyan-200 placeholder-slate-500 text-xs sm:text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono">
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-300">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto justify-end text-xs sm:text-sm text-slate-300">
            <span class="text-slate-400"><i class="fa-solid fa-arrows-rotate mr-1 text-cyan-400"></i>每 60 分鐘自動對齊 JSON 庫</span>
            <button onclick="manualRefresh()" class="tech-card px-3 py-1 text-cyan-300 hover:text-white hover:border-cyan-400 transition-all flex items-center gap-1.5 font-semibold text-xs">
                <i class="fa-solid fa-rotate text-xs"></i> 立即重載
            </button>
        </div>
    </div>

    <!-- 產品表格與資料區塊 -->
    <main class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <div class="tech-card p-3 flex-1 flex flex-col min-h-0 overflow-hidden">
            <div class="tech-title mb-2 shrink-0">
                <span><i class="fa-solid fa-table-list mr-2 text-cyan-400"></i>PCB 產品生產規格與加工資料表</span>
                <span id="page-info-count" class="text-xs sm:text-sm text-slate-400 font-normal font-mono">
                    顯示第 <span id="current-range-text">0-0</span> 筆，共 <span id="total-orders-text">0</span> 筆
                </span>
            </div>

            <!-- 表格區塊 -->
            <div class="flex-1 overflow-x-auto overflow-y-auto custom-scrollbar pr-1 min-h-0">
                <table class="w-full text-xs sm:text-sm text-center border-collapse min-w-[1250px]">
                    <thead class="text-cyan-300 bg-cyan-950/90 sticky top-0 backdrop-blur-md z-10 border-b border-cyan-800/60 shadow-md">
                        <tr>
                            <th class="p-2.5 sort-header rounded-l w-[12%]" onclick="sortTable('柏匯料號')">
                                柏匯料號 <span id="sort-icon-柏匯料號" class="text-xs ml-0.5">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[15%]" onclick="sortTable('客戶料號')">
                                客戶料號 <span id="sort-icon-客戶料號" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[5%]" onclick="sortTable('形狀')">
                                形狀 <span id="sort-icon-形狀" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[6%]" onclick="sortTable('單片長')">
                                單片長 <span id="sort-icon-單片長" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[6%]" onclick="sortTable('單片寬')">
                                單片寬 <span id="sort-icon-單片寬" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[5%]" onclick="sortTable('排版數量')">
                                排版數 <span id="sort-icon-排版數量" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[10%]" onclick="sortTable('廠牌型號')">
                                使用材料 <span id="sort-icon-廠牌型號" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[8%]" onclick="sortTable('尺寸')">
                                發料尺寸 <span id="sort-icon-尺寸" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[5%]" onclick="sortTable('瓦數')">
                                瓦數 <span id="sort-icon-瓦數" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[5%]" onclick="sortTable('銅箔厚度')">
                                銅厚 <span id="sort-icon-銅箔厚度" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[5%]" onclick="sortTable('板材厚度')">
                                板厚 <span id="sort-icon-板材厚度" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[11%]" onclick="sortTable('防焊')">
                                製程規格 <span id="sort-icon-防焊" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 sort-header w-[6%]" onclick="sortTable('建立日期')">
                                建立日期 <span id="sort-icon-建立日期" class="text-xs">↕</span>
                            </th>
                            <th class="p-2.5 rounded-r w-[6%] text-center whitespace-nowrap">成品庫存</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-cyan-900/30 font-mono text-xs sm:text-sm">
                        <!-- 資料動態生成 -->
                    </tbody>
                </table>
            </div>

            <!-- 分頁導覽列 -->
            <div class="flex flex-col sm:flex-row items-center justify-between border-t border-cyan-900/50 pt-2 mt-2 text-xs sm:text-sm gap-2 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-slate-400">每頁顯示：</span>
                    <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-cyan-950 border border-cyan-800 text-cyan-300 rounded px-2 py-1 focus:outline-none text-xs sm:text-sm">
                        <option value="auto" selected>自動適應</option>
                        <option value="10">10 筆</option>
                        <option value="15">15 筆</option>
                        <option value="25">25 筆</option>
                        <option value="50">50 筆</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <button id="prev-page-btn" onclick="changePage(-1)" class="tech-card px-3 py-1 text-cyan-400 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 font-semibold text-xs sm:text-sm">
                        <i class="fa-solid fa-chevron-left text-xs"></i> 上一頁
                    </button>
                    <span class="text-cyan-300 font-mono px-3 text-sm sm:text-base">
                        <span id="current-page-text">1</span> / <span id="total-pages-text">1</span>
                    </span>
                    <button id="next-page-btn" onclick="changePage(1)" class="tech-card px-3 py-1 text-cyan-400 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 font-semibold text-xs sm:text-sm">
                        下一頁 <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 庫存速查對話框 (Modal) -->
    <div id="inventoryModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
        <div class="tech-card w-full max-w-2xl p-4 sm:p-6 border-cyan-400 shadow-[0_0_30px_rgba(0,240,255,0.3)] relative flex flex-col max-h-[85vh]">
            <button onclick="closeInventoryModal()" class="absolute top-4 right-4 text-slate-400 hover:text-cyan-400 text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="tech-title mb-4 shrink-0">
                <span><i class="fa-solid fa-boxes-packing mr-2 text-cyan-400"></i>成品庫存明細查詢</span>
            </div>
            
            <div id="modalContent" class="flex-1 overflow-y-auto custom-scrollbar space-y-4">
                <!-- 動態注入內容 -->
            </div>
        </div>
    </div>

    <script>
        let PAGE_SIZE = 15;
        let isAutoPageSize = true;
        let currentPage = 1;
        let allProducts = [];
        let filteredProducts = [];
        let inventoryDataMap = {}; // 存放對齊的庫存 JSON
        
        let currentSortField = '柏匯料號';
        let isAscending = true;

        const REFRESH_INTERVAL_SECONDS = 3600;
        let countdownSeconds = REFRESH_INTERVAL_SECONDS;

        const fallbackData = {
            "file_last_modified": "2026-09-25 18:30:00",
            "products": [
                {
                    "柏匯料號": "KT-079-35-0001B",
                    "板材類別": "金屬基板",
                    "客戶料號": "20-G509(10) ECP5 REV D.0",
                    "底片編號": "BH5619",
                    "形狀": "不規則",
                    "單片長": "33.3",
                    "單片寬": "26.8",
                    "排版數量": "-",
                    "廠牌型號": "清晰 CS-AL-88-AD2(銅基板)",
                    "尺寸": "135x300mm",
                    "瓦數": "1",
                    "銅箔厚度": "1",
                    "板材厚度": "1.6",
                    "防焊": "濕膜",
                    "文字": "黑色",
                    "成型": "NC V-cut",
                    "表面處理": "OSP",
                    "建立日期": "2021-04-27"
                }
            ]
        };

        function formatDateTime(date) {
            const pad = (n) => n.toString().padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function startLiveClockAndCountdown() {
            const currentTimeElem = document.getElementById('current-time');
            const countdownElem = document.getElementById('countdown-timer');

            setInterval(() => {
                currentTimeElem.innerText = `現在時間: ${formatDateTime(new Date())}`;

                countdownSeconds--;
                if (countdownSeconds <= 0) {
                    countdownSeconds = REFRESH_INTERVAL_SECONDS;
                    loadProductData();
                }

                const mins = Math.floor(countdownSeconds / 60).toString().padStart(2, '0');
                const secs = (countdownSeconds % 60).toString().padStart(2, '0');
                countdownElem.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function manualRefresh() {
            countdownSeconds = REFRESH_INTERVAL_SECONDS;
            loadProductData();
        }

        function autoCalculatePageSize() {
            if (!isAutoPageSize) return;
            const tableContainer = document.querySelector('.custom-scrollbar');
            if (tableContainer) {
                const containerHeight = tableContainer.clientHeight;
                const headerHeight = 45; 
                const rowHeight = 58;    
                const calculated = Math.floor((containerHeight - headerHeight) / rowHeight);
                PAGE_SIZE = Math.max(5, calculated || 10);
            }
        }

        async function loadProductData() {
            const dataFileInfo = document.getElementById('data-file-info');
            const statusDot = document.getElementById('connection-status');
            const timestamp = new Date().getTime();

            // 1. 同時加載產品規格與庫存 JSON
            try {
                const [prodRes, invRes] = await Promise.allSettled([
                    fetch(`./products_kt.json?t=${timestamp}`),
                    fetch(`./merged_inventory_kt.json?t=${timestamp}`)
                ]);

                if (invRes.status === 'fulfilled' && invRes.value.ok) {
                    const invJson = await invRes.value.json();
                    const list = invJson.data || invJson.products || [];
                    inventoryDataMap = {};
                    list.forEach(item => {
                        const code = item['料號'] || item['柏匯料號'];
                        if (code) inventoryDataMap[code.trim().toUpperCase()] = item;
                    });
                }

                if (prodRes.status === 'fulfilled' && prodRes.value.ok) {
                    const data = await prodRes.value.json();
                    let rawList = Array.isArray(data) ? data : (data.products || []);
                    
                    allProducts = rawList.map(item => {
                        const bhNo = item['柏匯料號'] || '';
                        const isFR4 = bhNo.toUpperCase().startsWith('KT-F');
                        return {
                            ...item,
                            '板材類別': isFR4 ? 'FR4' : (item['板材類別'] || '金屬基板')
                        };
                    });

                    dataFileInfo.innerText = `products_kt.json 更新時間: ${data.file_last_modified || '即時'}`;
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-online";
                    dataFileInfo.className = "font-semibold text-emerald-400";
                } else {
                    throw new Error("無法取得規格主資料");
                }

            } catch (error) {
                console.warn('改載入預設示範資料:', error.message);
                allProducts = fallbackData.products;
                dataFileInfo.innerText = `products_kt.json 更新時間: ${fallbackData.file_last_modified} (示範)`;
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
                dataFileInfo.className = "font-semibold text-amber-400";
            }

            updateKpiStats();
            handleSearch();
        }

        function updateKpiStats() {
            document.getElementById('kpi-total').innerText = allProducts.length.toLocaleString();
            
            const metalCount = allProducts.filter(item => item['板材類別'] === '金屬基板').length;
            const fr4Count = allProducts.filter(item => item['板材類別'] === 'FR4').length;

            document.getElementById('kpi-metal-pcb').innerText = metalCount.toLocaleString();
            document.getElementById('kpi-fr4-pcb').innerText = fr4Count.toLocaleString();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');

            if (query) {
                clearBtn.classList.remove('hidden');
                filteredProducts = allProducts.filter(item => {
                    const code = (item['柏匯料號'] || '').toLowerCase();
                    const custCode = (item['客戶料號'] || '').toLowerCase();
                    const filmCode = (item['底片編號'] || '').toLowerCase();
                    const boardType = (item['板材類別'] || '').toLowerCase();
                    const mat = (item['廠牌型號'] || item['使用材料'] || '').toLowerCase();

                    return code.includes(query) || custCode.includes(query) || filmCode.includes(query) || boardType.includes(query) || mat.includes(query);
                });
            } else {
                clearBtn.classList.add('hidden');
                filteredProducts = [...allProducts];
            }

            document.getElementById('kpi-filtered').innerText = filteredProducts.length.toLocaleString();
            currentPage = 1;
            applySortAndRender();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch();
        }

        function sortTable(field) {
            if (currentSortField === field) {
                isAscending = !isAscending;
            } else {
                currentSortField = field;
                isAscending = true;
            }
            updateSortIcons();
            applySortAndRender();
        }

        function updateSortIcons() {
            const fields = ['柏匯料號', '客戶料號', '形狀', '單片長', '單片寬', '排版數量', '廠牌型號', '尺寸', '瓦數', '銅箔厚度', '板材厚度', '防焊', '建立日期'];
            fields.forEach(f => {
                const iconElem = document.getElementById(`sort-icon-${f}`);
                if (iconElem) {
                    if (f === currentSortField) {
                        iconElem.innerText = isAscending ? '▲' : '▼';
                        iconElem.className = 'text-cyan-400 font-bold ml-0.5';
                    } else {
                        iconElem.innerText = '↕';
                        iconElem.className = 'text-slate-600 text-xs ml-0.5';
                    }
                }
            });
        }

        function applySortAndRender() {
            filteredProducts.sort((a, b) => {
                let valA = a[currentSortField] || '';
                let valB = b[currentSortField] || '';

                if (['排版數量', '單片長', '單片寬'].includes(currentSortField)) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                }

                if (valA < valB) return isAscending ? -1 : 1;
                if (valA > valB) return isAscending ? 1 : -1;
                return 0;
            });

            renderTablePage();
        }

        function renderTablePage() {
            autoCalculatePageSize();
            
            const totalOrders = filteredProducts.length;
            const totalPages = Math.ceil(totalOrders / PAGE_SIZE) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const endIndex = Math.min(startIndex + PAGE_SIZE, totalOrders);
            const pageData = filteredProducts.slice(startIndex, endIndex);

            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="14" class="text-center py-10 text-slate-500 font-sans text-base">查無相符的 PCB 產品資料</td></tr>`;
            } else {
                pageData.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-cyan-900/25 transition-colors duration-150 border-b border-cyan-950/60 text-center cursor-pointer";

                    const bhPartNo = item['柏匯料號'] || '-';
                    const boardType = item['板材類別'] || '金屬基板';
                    const boardBadgeClass = boardType === 'FR4' ? 'badge-fr4' : 'badge-metal';

                    const mask = item['防焊Color'] || item['防焊顏色'] || item['防焊'] || '';
                    const text = item['文字Color'] || item['文字顏色'] || item['文字'] || '';
                    const route = item['成型'] || '';
                    const finish = item['表面處理'] || '';

                    const row1Badges = [];
                    if (mask) row1Badges.push(`<span class="spec-badge badge-mask">防焊:${mask}</span>`);
                    if (text) row1Badges.push(`<span class="spec-badge badge-text">文字:${text}</span>`);

                    const row2Badges = [];
                    if (route) row2Badges.push(`<span class="spec-badge badge-route">成型:${route}</span>`);
                    if (finish) row2Badges.push(`<span class="spec-badge badge-finish">表面:${finish}</span>`);

                    // 取得對應庫存
                    const invInfo = inventoryDataMap[bhPartNo.trim().toUpperCase()];
                    const totalQty = invInfo ? (parseFloat(invInfo['總庫存量']) || 0) : null;

                    let invBadgeHtml = `<span class="text-slate-500 text-xs">-</span>`;
                    if (totalQty !== null) {
                        invBadgeHtml = totalQty > 0 
                            ? `<span class="px-2 py-0.5 rounded bg-emerald-950/80 border border-emerald-500/60 text-emerald-300 font-bold text-xs">${totalQty.toLocaleString()}</span>`
                            : `<span class="px-2 py-0.5 rounded bg-slate-900/80 border border-slate-700 text-slate-500 text-xs">0</span>`;
                    }

                    tr.onclick = (e) => {
                        // 點擊整列可快查庫存
                        openInventoryModal(bhPartNo);
                    };

                    tr.innerHTML = `
                        <td class="p-2 font-bold text-cyan-300 text-center whitespace-nowrap text-sm">
                            <div class="text-cyan-300 font-bold">${bhPartNo}</div>
                            <div class="text-[11px] text-cyan-400 font-semibold my-0.5 flex items-center justify-center gap-1 flex-wrap">
                                <span>底片: ${item['底片編號'] || '-'}</span>
                                <span class="spec-badge ${boardBadgeClass}">${boardType}</span>
                            </div>
                        </td>
                        <td class="p-2 text-slate-200 font-sans text-center break-all leading-relaxed font-medium text-xs sm:text-sm">
                            ${item['客戶料號'] || '-'}
                        </td>
                        <td class="p-2 text-slate-300 text-center">${item['形狀'] || '-'}</td>
                        <td class="p-2 text-cyan-300 text-center font-mono font-semibold">${item['單片長'] || '-'}</td>
                        <td class="p-2 text-cyan-300 text-center font-mono font-semibold">${item['單片寬'] || '-'}</td>
                        <td class="p-2 text-center text-cyan-300 font-bold whitespace-nowrap">
                            ${item['排版數量'] ? `${item['排版數量']}` : '-'}
                        </td>
                        <td class="p-2 text-slate-200 text-center font-sans text-xs">
                            ${item['廠牌型號'] || item['使用材料'] || '-'}
                        </td>
                        <td class="p-2 text-cyan-200 text-center whitespace-nowrap text-xs">${item['尺寸'] || '-'}</td>
                        <td class="p-2 text-amber-300 font-bold text-center whitespace-nowrap">${item['瓦數'] || '-'}</td>
                        <td class="p-2 text-emerald-300 font-bold text-center whitespace-nowrap">${item['銅箔厚度'] || '-'}</td>
                        <td class="p-2 text-cyan-300 font-bold text-center whitespace-nowrap">${item['板材厚度'] || '-'}</td>
                        <td class="p-2 text-center">
                            <div class="flex flex-col items-center gap-1">
                                <div class="flex flex-wrap justify-center gap-1">
                                    ${row1Badges.length > 0 ? row1Badges.join('') : ''}
                                </div>
                                <div class="flex flex-wrap justify-center gap-1">
                                    ${row2Badges.length > 0 ? row2Badges.join('') : ''}
                                </div>
                                ${row1Badges.length === 0 && row2Badges.length === 0 ? '-' : ''}
                            </div>
                        </td>
                        <td class="p-2 text-center text-slate-400 text-xs whitespace-nowrap font-mono">
                            ${item['建立日期'] ? item['建立日期'].split(' ')[0] : '-'}
                        </td>
                        <td class="p-2 text-center">
                            ${invBadgeHtml}
                        </td>
                    `;

                    tbody.appendChild(tr);
                });
            }

            document.getElementById('current-page-text').innerText = currentPage;
            document.getElementById('total-pages-text').innerText = totalPages;
            document.getElementById('total-orders-text').innerText = totalOrders.toLocaleString();
            document.getElementById('current-range-text').innerText = totalOrders === 0 ? '0-0' : `${startIndex + 1}-${endIndex}`;

            document.getElementById('prev-page-btn').disabled = (currentPage === 1);
            document.getElementById('next-page-btn').disabled = (currentPage === totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderTablePage();
        }

        function changePageSize(size) {
            if (size === 'auto') {
                isAutoPageSize = true;
            } else {
                isAutoPageSize = false;
                PAGE_SIZE = parseInt(size, 10);
            }
            currentPage = 1;
            renderTablePage();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function updateFullscreenBtnUI() {
            const btnText = document.getElementById('fullscreen-btn-text');
            const btnIcon = document.querySelector('#fullscreen-btn i');
            if (btnText && btnIcon) {
                if (document.fullscreenElement) {
                    btnText.innerText = '退出全螢幕';
                    btnIcon.className = 'fa-solid fa-compress text-xs';
                } else {
                    btnText.innerText = '全螢幕';
                    btnIcon.className = 'fa-solid fa-expand text-xs';
                }
            }
        }

        /* 成品庫存 Modal 邏輯 */
        function openInventoryModal(partNo) {
            const modal = document.getElementById('inventoryModal');
            const content = document.getElementById('modalContent');
            const inv = inventoryDataMap[partNo.trim().toUpperCase()];

            if (!inv) {
                content.innerHTML = `
                    <div class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-amber-400"></i>
                        <p class="text-base font-semibold">料號【${partNo}】無成品庫存紀錄</p>
                    </div>
                `;
            } else {
                const totalQty = parseFloat(inv['總庫存量']) || 0;
                const details = inv['庫存明細'] || inv['批次細節'] || [];

                let detailsTableHtml = '';
                if (Array.isArray(details) && details.length > 0) {
                    detailsTableHtml = `
                        <div class="mt-4">
                            <h4 class="text-xs font-bold text-cyan-300 mb-2"><i class="fa-solid fa-layer-group mr-1"></i>批次存放明細</h4>
                            <table class="w-full text-xs text-center border-collapse">
                                <thead>
                                    <tr class="bg-cyan-950/80 text-cyan-300 border-b border-cyan-800/60">
                                        <th class="p-2">儲位/批次</th>
                                        <th class="p-2">數量</th>
                                        <th class="p-2">入庫日期</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-cyan-900/30">
                                    ${details.map(d => `
                                        <tr>
                                            <td class="p-2 text-slate-300">${d['儲位'] || d['批次'] || '-'}</td>
                                            <td class="p-2 font-bold text-emerald-300">${(d['數量'] || 0).toLocaleString()}</td>
                                            <td class="p-2 text-slate-400 font-mono">${d['日期'] || '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="tech-card p-3">
                            <div class="text-xs text-slate-400">柏匯料號</div>
                            <div class="text-lg font-bold text-cyan-300 font-mono">${inv['料號'] || partNo}</div>
                        </div>
                        <div class="tech-card p-3 border-emerald-500/40">
                            <div class="text-xs text-slate-400">總庫存數量</div>
                            <div class="text-2xl font-extrabold text-emerald-400 font-mono">${totalQty.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="tech-card p-3 text-xs space-y-1 text-slate-300">
                        <div><span class="text-slate-400">品名:</span> ${inv['品名'] || '-'}</div>
                        <div><span class="text-slate-400">客戶:</span> ${inv['客戶'] || '-'}</div>
                    </div>
                    ${detailsTableHtml}
                    <div class="pt-2 flex justify-end">
                        <a href="成品庫存-index.html?search=${encodeURIComponent(partNo)}" 
                           class="tech-card px-3 py-1.5 text-cyan-300 hover:text-white hover:border-cyan-400 text-xs font-bold inline-flex items-center gap-1.5 transition-all">
                            前往完整庫存系統 <i class="fa-solid fa-arrow-right text-xs"></i>
                        </a>
                    </div>
                `;
            }

            modal.classList.remove('hidden');
        }

        function closeInventoryModal() {
            document.getElementById('inventoryModal').classList.add('hidden');
        }

        document.addEventListener('fullscreenchange', updateFullscreenBtnUI);

        window.onresize = function() {
            if (isAutoPageSize) {
                renderTablePage();
            }
        };

        window.onload = function() {
            startLiveClockAndCountdown();
            loadProductData();
        };
    </script>
</body>
</html>
