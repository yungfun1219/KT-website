<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB 產品資料查詢系統 - 柏匯企業</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #030814;
            color: #d1e8ff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tech-card {
            background: rgba(8, 20, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.08), 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tech-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.12), 0 6px 25px rgba(0, 240, 255, 0.15);
        }

        .tech-title {
            color: #70d6ff;
            border-left: 4px solid #00f0ff;
            padding-left: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header {
            background: linear-gradient(180deg, rgba(10, 28, 58, 0.95) 0%, rgba(3, 8, 20, 0.9) 100%);
            border-bottom: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(5, 15, 30, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.4);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        .pulse-online {
            box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .sort-header {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
            text-align: center;
            font-size: 0.95rem;
        }
        .sort-header:hover {
            color: #ffffff;
            background-color: rgba(0, 240, 255, 0.15);
        }

        .badge-mask {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
        }
        .badge-text {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid #eab308;
            color: #fde047;
        }
        .badge-route {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .badge-finish {
            background: rgba(249, 115, 22, 0.2);
            border: 1px solid #f97316;
            color: #fdba74;
        }

        .badge-fr4 {
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid #a855f7;
            color: #d8b4fe;
        }
        .badge-metal {
            background: rgba(245, 158, 11, 0.25);
            border: 1px solid #f59e0b;
            color: #fde047;
        }
        
        .spec-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }
    </style>
</head>
<body class="p-2 sm:p-4">

    <!-- 頂部標題、現在時間（正中間上方）、檔案更新時間與統計 KPI -->
    <header class="rounded-lg p-3.5 mb-3 flex flex-col lg:flex-row items-center justify-between gap-4 relative">
        
        <!-- 左側：標題、全螢幕與更新時間 -->
        <div class="flex items-center gap-3 w-full lg:w-auto">
            <i class="fa-solid fa-microchip text-3xl text-cyan-400 animate-pulse shrink-0"></i>
            <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-3">
                    <h1 class="text-2xl font-bold tracking-wider text-cyan-400 drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]">
                        PCB 產品規格與工程資料查詢系統
                    </h1>
                    <!-- 全螢幕按鈕 -->
                    <button id="fullscreen-btn" onclick="toggleFullScreen()" class="tech-card px-3 py-1.5 text-cyan-400 hover:text-white hover:border-cyan-400 text-sm font-bold flex items-center gap-1.5 transition-all">
                        <i class="fa-solid fa-expand text-xs"></i>
                        <span id="fullscreen-btn-text">全螢幕</span>
                    </button>
                </div>

                <!-- 檔案更新時間 + 自動更新倒數 -->
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-300 mt-2">
                    <div class="flex items-center gap-2">
                        <span id="connection-status" class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-online"></span>
                        <span id="file-update-time" class="font-semibold text-slate-300">檔案更新時間: 讀取中...</span>
                    </div>
                    
                    <span class="text-slate-600 hidden sm:inline">|</span>

                    <div class="flex items-center gap-1.5 text-amber-400 font-semibold font-mono bg-amber-950/40 border border-amber-500/40 px-2.5 py-0.5 rounded">
                        <i class="fa-solid fa-hourglass-half animate-spin text-xs"></i>
                        <span>自動更新倒數:</span>
                        <span id="countdown-timer" class="font-bold text-amber-300 text-base">60:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 正中間上方：現在時間 -->
        <div class="w-full lg:w-auto lg:absolute lg:left-1/2 lg:-translate-x-1/2 lg:top-3.5 flex justify-center">
            <div class="flex items-center bg-slate-900/90 border border-cyan-500/60 px-4 py-1.5 rounded-md text-cyan-300 font-mono shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                <i class="fa-regular fa-clock mr-2 text-cyan-400 animate-pulse"></i>
                <span id="current-time" class="text-lg font-extrabold tracking-wider text-cyan-300">
                    現在時間: 載入中...
                </span>
            </div>
        </div>

        <!-- 右側：Metric KPI Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full lg:w-auto shrink-0 lg:mt-6">
            <div class="tech-card px-3.5 py-2 flex items-center gap-2.5">
                <i class="fa-solid fa-boxes-stacked text-cyan-400 text-xl"></i>
                <div>
                    <div class="text-xs text-slate-400">總產品數</div>
                    <div id="kpi-total" class="text-xl font-bold text-cyan-400">0</div>
                </div>
            </div>

            <div class="tech-card px-3.5 py-2 flex items-center gap-2.5 border-emerald-500/40">
                <i class="fa-solid fa-filter text-emerald-400 text-xl"></i>
                <div>
                    <div class="text-xs text-slate-400">當前篩選</div>
                    <div id="kpi-filtered" class="text-xl font-bold text-emerald-400">0</div>
                </div>
            </div>

            <div class="tech-card px-3.5 py-2 flex items-center gap-2.5 border-amber-500/40">
                <i class="fa-solid fa-layer-group text-amber-400 text-xl"></i>
                <div>
                    <div class="text-xs text-slate-400">金屬基板數</div>
                    <div id="kpi-metal-pcb" class="text-xl font-bold text-amber-400">0</div>
                </div>
            </div>

            <div class="tech-card px-3.5 py-2 flex items-center gap-2.5 border-purple-500/40">
                <i class="fa-solid fa-microchip text-purple-400 text-xl"></i>
                <div>
                    <div class="text-xs text-slate-400">FR4 板數</div>
                    <div id="kpi-fr4-pcb" class="text-xl font-bold text-purple-400">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主體內容區塊 -->
    <main class="flex-1 flex flex-col gap-3 min-h-0">

        <!-- 搜尋與過濾工具列 -->
        <div class="tech-card p-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="relative w-full md:w-1/2">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400 text-base"></i>
                <input type="text" id="searchInput" onkeyup="handleSearch()" 
                       placeholder="輸入 柏匯料號 / 客戶料號 / 底片編號 / 板材類別 / 使用材料 快速搜尋..." 
                       class="w-full pl-10 pr-8 py-2 bg-slate-900/80 border border-cyan-800/80 rounded text-cyan-200 placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-300">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end text-sm text-slate-300">
                <span class="text-slate-400"><i class="fa-solid fa-arrows-rotate mr-1 text-cyan-400"></i>每 60 分鐘自動對齊 JSON 庫</span>
                <button onclick="manualRefresh()" class="tech-card px-3.5 py-1.5 text-cyan-300 hover:text-white hover:border-cyan-400 transition-all flex items-center gap-1.5 font-semibold">
                    <i class="fa-solid fa-rotate text-xs"></i> 立即重載
                </button>
            </div>
        </div>

        <!-- 產品表格區塊 -->
        <div class="tech-card p-3.5 flex-1 flex flex-col min-h-0">
            <div class="tech-title mb-3">
                <span><i class="fa-solid fa-table-list mr-2 text-cyan-400"></i>PCB 產品生產規格與加工資料表</span>
                <span id="page-info-count" class="text-sm text-slate-400 font-normal font-mono">
                    顯示第 <span id="current-range-text">0-0</span> 筆，共 <span id="total-orders-text">0</span> 筆
                </span>
            </div>

            <div class="flex-1 overflow-x-auto overflow-y-auto custom-scrollbar pr-1">
                <table class="w-full text-sm text-center border-collapse min-w-[1300px]">
                    <thead class="text-cyan-300 bg-cyan-950/90 sticky top-0 backdrop-blur-md z-10 border-b border-cyan-800/60">
                        <tr>
                            <th class="p-3 sort-header rounded-l w-[12%]" onclick="sortTable('柏匯料號')">
                                柏匯料號 <span id="sort-icon-柏匯料號" class="text-xs ml-0.5">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[16%]" onclick="sortTable('客戶料號')">
                                客戶料號 <span id="sort-icon-客戶料號" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[6%]" onclick="sortTable('形狀')">
                                形狀 <span id="sort-icon-形狀" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[7%]" onclick="sortTable('單片長')">
                                單片長 <span id="sort-icon-單片長" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[7%]" onclick="sortTable('單片寬')">
                                單片寬 <span id="sort-icon-單片寬" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[6%]" onclick="sortTable('排版數量')">
                                排版數 <span id="sort-icon-排版數量" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[10%]" onclick="sortTable('廠牌型號')">
                                使用材料 <span id="sort-icon-廠牌型號" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[8%]" onclick="sortTable('尺寸')">
                                發料尺寸 <span id="sort-icon-尺寸" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[5%]" onclick="sortTable('瓦數')">
                                瓦數 <span id="sort-icon-瓦數" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[5%]" onclick="sortTable('銅箔厚度')">
                                銅厚 <span id="sort-icon-銅箔厚度" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[5%]" onclick="sortTable('板材厚度')">
                                板厚 <span id="sort-icon-板材厚度" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header w-[13%]" onclick="sortTable('防焊')">
                                製程規格 <span id="sort-icon-防焊" class="text-xs">↕</span>
                            </th>
                            <th class="p-3 sort-header rounded-r w-[6%] text-center whitespace-nowrap" onclick="sortTable('建立日期')">
                                建立日期 <span id="sort-icon-建立日期" class="text-xs">↕</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-cyan-900/30 font-mono text-sm">
                        <!-- 資料動態生成 -->
                    </tbody>
                </table>
            </div>

            <!-- 分頁導覽列 -->
            <div class="flex flex-col sm:flex-row items-center justify-between border-t border-cyan-900/50 pt-2.5 mt-2 text-sm gap-2">
                <div class="flex items-center gap-2">
                    <span class="text-slate-400">每頁顯示：</span>
                    <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-cyan-950 border border-cyan-800 text-cyan-300 rounded px-2.5 py-1 focus:outline-none text-sm">
                        <option value="15" selected>15 筆</option>
                        <option value="30">30 筆</option>
                        <option value="50">50 筆</option>
                        <option value="100">100 筆</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <button id="prev-page-btn" onclick="changePage(-1)" class="tech-card px-3.5 py-1.5 text-cyan-400 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 font-semibold">
                        <i class="fa-solid fa-chevron-left text-xs"></i> 上一頁
                    </button>
                    <span class="text-cyan-300 font-mono px-3 text-base">
                        <span id="current-page-text">1</span> / <span id="total-pages-text">1</span>
                    </span>
                    <button id="next-page-btn" onclick="changePage(1)" class="tech-card px-3.5 py-1.5 text-cyan-400 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 font-semibold">
                        下一頁 <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        let PAGE_SIZE = 15;
        let currentPage = 1;
        let allProducts = [];
        let filteredProducts = [];
        
        let currentSortField = '柏匯料號';
        let isAscending = true;

        const REFRESH_INTERVAL_SECONDS = 3600;
        let countdownSeconds = REFRESH_INTERVAL_SECONDS;

        const fallbackData = {
            "file_last_modified": "2026-09-25 18:30:00",
            "products": [
                {
                    "柏匯料號": "KT-079-35-0001B",
                    "板材類別": "金屬基板",
                    "客戶料號": "20-G509(10) ECP5 REV D.0",
                    "底片編號": "BH5619",
                    "形狀": "不規則",
                    "單片長": "33.3",
                    "單片寬": "26.8",
                    "排版數量": "-",
                    "廠牌型號": "清晰 CS-AL-88-AD2(銅基板)",
                    "尺寸": "135x300mm",
                    "瓦數": "1",
                    "銅箔厚度": "1",
                    "板材厚度": "1.6",
                    "防焊": "濕膜",
                    "文字": "黑色",
                    "成型": "NC V-cut",
                    "表面處理": "OSP",
                    "建立日期": "2021-04-27"
                }
            ]
        };

        function formatDateTime(date) {
            const pad = (n) => n.toString().padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function startLiveClockAndCountdown() {
            const currentTimeElem = document.getElementById('current-time');
            const countdownElem = document.getElementById('countdown-timer');

            setInterval(() => {
                currentTimeElem.innerText = `現在時間: ${formatDateTime(new Date())}`;

                countdownSeconds--;
                if (countdownSeconds <= 0) {
                    countdownSeconds = REFRESH_INTERVAL_SECONDS;
                    loadProductData();
                }

                const mins = Math.floor(countdownSeconds / 60).toString().padStart(2, '0');
                const secs = (countdownSeconds % 60).toString().padStart(2, '0');
                countdownElem.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function manualRefresh() {
            countdownSeconds = REFRESH_INTERVAL_SECONDS;
            loadProductData();
        }

        async function loadProductData() {
            const fileTimeIndicator = document.getElementById('file-update-time');
            const statusDot = document.getElementById('connection-status');
            const timestamp = new Date().getTime();

            try {
                const response = await fetch(`./products_kt.json?t=${timestamp}`);
                if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);

                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allProducts = data;
                    fileTimeIndicator.innerText = `檔案更新時間: 未提供 (標準 JSON)`;
                } else {
                    allProducts = data.products || [];
                    fileTimeIndicator.innerText = `檔案更新時間: ${data.file_last_modified || '未知'}`;
                }

                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-online";
                fileTimeIndicator.className = "font-semibold text-emerald-400";

            } catch (error) {
                console.warn('無法讀取 products_kt.json，改載入預設示範資料:', error.message);
                allProducts = fallbackData.products;
                fileTimeIndicator.innerText = `檔案更新時間: ${fallbackData.file_last_modified} (示範)`;
                
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
                fileTimeIndicator.className = "font-semibold text-amber-400";
            }

            updateKpiStats();
            handleSearch();
        }

        function updateKpiStats() {
            document.getElementById('kpi-total').innerText = allProducts.length;
            
            const metalCount = allProducts.filter(item => item['板材類別'] === '金屬基板').length;
            const fr4Count = allProducts.filter(item => item['板材類別'] === 'FR4').length;

            document.getElementById('kpi-metal-pcb').innerText = metalCount;
            document.getElementById('kpi-fr4-pcb').innerText = fr4Count;
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');

            if (query) {
                clearBtn.classList.remove('hidden');
                filteredProducts = allProducts.filter(item => {
                    const code = (item['柏匯料號'] || '').toLowerCase();
                    const custCode = (item['客戶料號'] || '').toLowerCase();
                    const filmCode = (item['底片編號'] || '').toLowerCase();
                    const boardType = (item['板材類別'] || '').toLowerCase();
                    const mat = (item['廠牌型號'] || item['使用材料'] || '').toLowerCase();

                    return code.includes(query) || custCode.includes(query) || filmCode.includes(query) || boardType.includes(query) || mat.includes(query);
                });
            } else {
                clearBtn.classList.add('hidden');
                filteredProducts = [...allProducts];
            }

            document.getElementById('kpi-filtered').innerText = filteredProducts.length;
            currentPage = 1;
            applySortAndRender();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch();
        }

        function sortTable(field) {
            if (currentSortField === field) {
                isAscending = !isAscending;
            } else {
                currentSortField = field;
                isAscending = true;
            }
            updateSortIcons();
            applySortAndRender();
        }

        function updateSortIcons() {
            const fields = ['柏匯料號', '客戶料號', '形狀', '單片長', '單片寬', '排版數量', '廠牌型號', '尺寸', '瓦數', '銅箔厚度', '板材厚度', '防焊', '建立日期'];
            fields.forEach(f => {
                const iconElem = document.getElementById(`sort-icon-${f}`);
                if (iconElem) {
                    if (f === currentSortField) {
                        iconElem.innerText = isAscending ? '▲' : '▼';
                        iconElem.className = 'text-cyan-400 font-bold ml-0.5';
                    } else {
                        iconElem.innerText = '↕';
                        iconElem.className = 'text-slate-600 text-xs ml-0.5';
                    }
                }
            });
        }

        function applySortAndRender() {
            filteredProducts.sort((a, b) => {
                let valA = a[currentSortField] || '';
                let valB = b[currentSortField] || '';

                if (['排版數量', '單片長', '單片寬'].includes(currentSortField)) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                }

                if (valA < valB) return isAscending ? -1 : 1;
                if (valA > valB) return isAscending ? 1 : -1;
                return 0;
            });

            renderTablePage();
        }

        function renderTablePage() {
            const totalOrders = filteredProducts.length;
            const totalPages = Math.ceil(totalOrders / PAGE_SIZE) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const endIndex = Math.min(startIndex + PAGE_SIZE, totalOrders);
            const pageData = filteredProducts.slice(startIndex, endIndex);

            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="13" class="text-center py-10 text-slate-500 font-sans text-base">查無相符的 PCB 產品資料</td></tr>`;
            } else {
                pageData.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-cyan-900/25 transition-colors duration-150 border-b border-cyan-950/60 text-center";

                    const boardType = item['板材類別'] || '金屬基板';
                    const boardBadgeClass = boardType === 'FR4' ? 'badge-fr4' : 'badge-metal';

                    const mask = item['防焊Color'] || item['防焊顏色'] || item['防焊'] || '';
                    const text = item['文字Color'] || item['文字顏色'] || item['文字'] || '';
                    const route = item['成型'] || '';
                    const finish = item['表面處理'] || '';

                    const row1Badges = [];
                    if (mask) row1Badges.push(`<span class="spec-badge badge-mask">防焊:${mask}</span>`);
                    if (text) row1Badges.push(`<span class="spec-badge badge-text">文字:${text}</span>`);

                    const row2Badges = [];
                    if (route) row2Badges.push(`<span class="spec-badge badge-route">成型:${route}</span>`);
                    if (finish) row2Badges.push(`<span class="spec-badge badge-finish">表面:${finish}</span>`);

                    tr.innerHTML = `
                        <td class="p-3 font-bold text-cyan-300 text-center whitespace-nowrap text-base">
                            <div class="text-cyan-300 font-bold">${item['柏匯料號'] || '-'}</div>
                            <div class="text-xs text-cyan-400 font-semibold my-1 flex items-center justify-center gap-1.5 flex-wrap">
                                <span>底片: ${item['底片編號'] || '-'}</span>
                                <span class="spec-badge ${boardBadgeClass}">${boardType}</span>
                            </div>
                        </td>
                        <td class="p-3 text-slate-200 font-sans text-center break-all leading-relaxed font-medium text-sm">
                            ${item['客戶料號'] || '-'}
                        </td>
                        <td class="p-3 text-slate-300 text-center">${item['形狀'] || '-'}</td>
                        <td class="p-3 text-cyan-300 text-center font-mono font-semibold text-base">${item['單片長'] || '-'}</td>
                        <td class="p-3 text-cyan-300 text-center font-mono font-semibold text-base">${item['單片寬'] || '-'}</td>
                        <td class="p-3 text-center text-cyan-300 font-bold whitespace-nowrap text-base">
                            ${item['排版數量'] ? `${item['排版數量']}` : '-'}
                        </td>
                        <td class="p-3 text-slate-200 text-center font-sans text-sm">
                            ${item['廠牌型號'] || item['使用材料'] || '-'}
                        </td>
                        <td class="p-3 text-cyan-200 text-center whitespace-nowrap text-sm">${item['尺寸'] || '-'}</td>
                        <td class="p-3 text-amber-300 font-bold text-center whitespace-nowrap text-base">${item['瓦數'] || '-'}</td>
                        <td class="p-3 text-emerald-300 font-bold text-center whitespace-nowrap text-base">${item['銅箔厚度'] || '-'}</td>
                        <td class="p-3 text-cyan-300 font-bold text-center whitespace-nowrap text-base">${item['板材厚度'] || '-'}</td>
                        <td class="p-3 text-center">
                            <div class="flex flex-col items-center gap-1.5">
                                <div class="flex flex-wrap justify-center gap-1">
                                    ${row1Badges.length > 0 ? row1Badges.join('') : ''}
                                </div>
                                <div class="flex flex-wrap justify-center gap-1">
                                    ${row2Badges.length > 0 ? row2Badges.join('') : ''}
                                </div>
                                ${row1Badges.length === 0 && row2Badges.length === 0 ? '-' : ''}
                            </div>
                        </td>
                        <td class="p-3 text-center text-slate-400 text-xs whitespace-nowrap font-mono">
                            ${item['建立日期'] ? item['建立日期'].split(' ')[0] : '-'}
                        </td>
                    `;

                    tbody.appendChild(tr);
                });
            }

            document.getElementById('current-page-text').innerText = currentPage;
            document.getElementById('total-pages-text').innerText = totalPages;
            document.getElementById('total-orders-text').innerText = totalOrders;
            document.getElementById('current-range-text').innerText = totalOrders === 0 ? '0-0' : `${startIndex + 1}-${endIndex}`;

            document.getElementById('prev-page-btn').disabled = (currentPage === 1);
            document.getElementById('next-page-btn').disabled = (currentPage === totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderTablePage();
        }

        function changePageSize(size) {
            PAGE_SIZE = parseInt(size, 10);
            currentPage = 1;
            renderTablePage();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                } else if (document.mozRequestFullScreen) {
                    document.mozRequestFullScreen();
                } else if (document.webkitRequestFullscreen) {
                    document.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function updateFullscreenBtnUI() {
            const btnText = document.getElementById('fullscreen-btn-text');
            const btnIcon = document.querySelector('#fullscreen-btn i');
            if (btnText && btnIcon) {
                if (document.fullscreenElement) {
                    btnText.innerText = '退出全螢幕';
                    btnIcon.className = 'fa-solid fa-compress text-xs';
                } else {
                    btnText.innerText = '全螢幕';
                    btnIcon.className = 'fa-solid fa-expand text-xs';
                }
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenBtnUI);

        window.onload = function() {
            startLiveClockAndCountdown();
            loadProductData();
        };
    </script>
</body>
</html>
